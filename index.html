    <main>
        <section class="hero">
            <h2>Bienvenue chez LUMONSE</h2>
            <p>Découvrez notre collection de vêtements tendance et de qualité.</p>
            <a href="#" class="btn">Voir les produits</a>
        </section>

        <section class="products">
            <h2>Nos Produits</h2>
            <section class="products">
    <div class="search-bar">
        <input type="text" id="search" placeholder="Rechercher un produit...">
    </div>
    <div class="filtres">
    <button class="filtre-btn actif" data-categorie="tous">Tous</button>
    <button class="filtre-btn" data-categorie="vestes">Vestes</button>
    <button class="filtre-btn" data-categorie="manteaux">Manteaux</button>

</div>

            </div>

        <section class="contact">
            <h2>Contactez-nous</h2>
            <p id="form-message"></p>
            <form id="contact-form" action="#" method="post">
                <label for="name">Nom:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit" class="btn">Envoyer</button>
            </form>
        </section>
